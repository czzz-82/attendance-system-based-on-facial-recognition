{% extends "base.html" %}
{% block title %}统计分析{% endblock %}
{% block content %}
<h2>统计分析</h2>

<div class="layout-2col">
  <section class="panel">
    <h3>活动参与频次（柱状图）</h3>
    <canvas id="activityBar" height="220"></canvas>
  </section>
  <section class="panel">
    <h3>情绪分布（饼图）</h3>
    <canvas id="emotionPie" height="220"></canvas>
  </section>
</div>

<section class="panel">
  <h3>情绪时间趋势（折线图）</h3>
  <canvas id="emotionLine" height="100"></canvas>
</section>

<section class="panel">
  <h3>参与频次明细</h3>
  <table class="data-table" id="actTable">
    <thead><tr><th>学号</th><th>姓名</th><th>参与次数</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/stats.js') }}"></script>
{% endblock %}
