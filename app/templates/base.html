<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}班级考勤系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  {% if user %}
  <header class="topbar">
    <div class="brand">📷 班级考勤系统</div>
    <nav>
      <a href="{{ url_for('pages.dashboard') }}">概览</a>
      <a href="{{ url_for('pages.attendance_page') }}">考勤打卡</a>
      {% if user.role == 'teacher' %}
        <a href="{{ url_for('pages.students_page') }}">学生管理</a>
        <a href="{{ url_for('pages.group_page') }}">合照识别</a>
      {% endif %}
      <a href="{{ url_for('pages.records_page') }}">考勤记录</a>
      <a href="{{ url_for('pages.stats_page') }}">统计分析</a>
    </nav>
    <div class="userinfo">
      <span>{{ user.username }} ({{ '教师' if user.role == 'teacher' else '学生' }})</span>
      <button id="logoutBtn" class="btn-link">退出</button>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
