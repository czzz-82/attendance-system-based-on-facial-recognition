{% extends "base.html" %}
{% block title %}考勤记录{% endblock %}
{% block content %}
<div class="page-title">
  <div>
    <h2>考勤记录</h2>
  </div>
  <div class="mini-stats" id="recordStats"></div>
</div>
<div class="tech-ribbon records-tech-ribbon">
  <span class="tech-chip">按日期筛选</span>
  <span class="tech-chip">按学生追踪</span>
  <span class="tech-chip">活体状态</span>
  <span class="tech-chip">Excel 导出</span>
</div>

<section class="panel">
  <form id="filterForm" class="row-form enhanced-form">
    <label>开始日期 <input type="date" name="date_from" /></label>
    <label>结束日期 <input type="date" name="date_to" /></label>
    {% if user.role == 'teacher' %}
    <label>学号 <input name="student_no" placeholder="按学号筛选" /></label>
    {% endif %}
    <label>状态
      <select name="status">
        <option value="">全部</option>
        <option value="success">成功</option>
        <option value="fail">活体未通过</option>
        <option value="unknown">未识别</option>
      </select>
    </label>
    <button type="submit" class="btn-primary">查询</button>
    <button type="button" class="btn" id="resetFilterBtn">重置</button>
    {% if user.role == 'teacher' %}
    <a href="/api/attendance/export" class="btn">📥 导出 Excel</a>
    {% endif %}
  </form>
</section>

<section class="panel">
  <div class="table-wrap">
    <table class="data-table" id="recordsTable">
      <thead>
        <tr><th>时间</th><th>学号</th><th>姓名</th><th>结果</th><th>活体</th><th>情绪</th><th>备注</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/records.js') }}?v=professional-v2"></script>
{% endblock %}
